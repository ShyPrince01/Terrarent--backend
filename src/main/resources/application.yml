spring:
  application:
    name: terrarent
  datasource:
    url: jdbc:postgresql://dpg-d933smlaeets73b2gb00-a.virginia-postgres.render.com:5432/lodgix_db
    username: lodgix_db_user
    password: 6fJg2OzywqEXqTFbBCrybTJGjeqYZLDp
    driver-class-name: org.postgresql.Driver
  main:
    allow-circular-references: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        # Note: Hibernate 6+ autodetects the dialect; if you get warnings, remove this line
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:aSuperSecretKeyForTerraRentApplicationWhichIsLongEnoughForHS256Algorithm}
      access-token-expiration: 7200000 
      refresh-token-expiration: 604800000 

